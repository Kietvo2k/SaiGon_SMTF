name: saigon-smart-traffic
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SMART_VAR_DIR: /app/var
      SMART_ALLOWED_ORIGINS: http://127.0.0.1:8088,http://localhost:8088
      # Demo: vi phạm tự xác nhận + báo về; 1% tự sinh khiếu nại mở.
      SMART_AUTO_VIOLATIONS: "1"
      SMART_AUTO_COMPLAINT_PCT: "1"
    volumes:
      - backend-var:/app/var
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '127.0.0.1:8088:80'
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  backend-var:
