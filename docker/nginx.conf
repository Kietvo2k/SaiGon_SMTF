map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 50m;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/v1/ {
        proxy_pass http://backend:8900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /ws/v1 {
        proxy_pass http://backend:8900;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location = /hcmc-poc/ { return 302 /hcmc-poc/webgpu-materials-24.html?app=smart&region=bac&view=overview; }
    location = /smart-traffic/backend/app/seed/cameras.json { try_files $uri =404; }
    location = /smart-traffic/backend/app/seed/plates.json { try_files $uri =404; }
    location = /smart-traffic/backend/app/seed/node_map.json { try_files $uri =404; }
    location /smart-traffic/ { return 404; }
    location ~ /\. { return 404; }
    # Runtime 3D dùng URL phiên bản ổn định; phải kiểm lại sau mỗi lần rebuild image.
    location ~* ^/hcmc-poc/.*\.(js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
