<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra bảng đèn</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;padding:20px;background:#0a151b;color:#eaf6f7;font:13px/1.5 "Segoe UI",system-ui,sans-serif}
  #smartHud32{width:320px;max-height:820px;overflow:auto;padding:14px;border:1px solid rgba(137,216,223,.28);border-radius:15px;background:#193238}
  #smartHud32 h2{margin:0 0 8px;font-size:15px}
  #smartHud32 dl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 10px}
  #smartHud32 dl div{padding:6px;border-radius:10px;background:rgba(3,17,21,.28);text-align:center}
  #smartHud32 dt{font-size:9px;opacity:.75}
  #smartHud32 dd{margin:0;font-size:16px;font-weight:700}
  .heat-sec32,.scn-sec32,.save-sec32{padding-top:8px;margin-top:8px;border-top:1px solid rgba(137,216,223,.2);font-size:11px}
  .scn-sec32 h3{margin:0 0 4px;font-size:12px}
  .scn-grid32 button{display:block;width:100%;margin:3px 0;padding:5px;border-radius:8px;border:1px solid rgba(137,216,223,.35);background:rgba(3,17,21,.28);color:inherit;font:inherit;font-size:10px;text-align:left}
</style>
</head>
<body>
<aside id="smartHud32" aria-label="Bảng điều khiển thử">
  <h2>Điều khiển đèn · Khu Bắc</h2>

  <section class="heat-sec32"><h3>Bản đồ nhiệt</h3><p>Nguyễn Hữu Cảnh · 91%</p></section>
  <section class="scn-sec32"><h3>Kịch bản</h3><div class="scn-grid32"><button>Xe khẩn cấp · ưu tiên qua nút</button><button>Ngập · Nguyễn Hữu Cảnh</button></div></section>
  <section class="save-sec32">Tiết kiệm tài nguyên</section>
</aside>

      queue:[4,6], allocation:[34,16], allocationPct:[68,32],

  ];
  const host = document.querySelector('#smartHud32');
  const inspector = mountSignalInspector32(host, {
    readSnapshot: () => ({ mode: 'fixed', time: 30, rows }),
    onFocus: () => {},
    onBoxes: () => {}
  });
  const lab = mountTestLab32(host, {
    spawnNpc: (n) => ({ added: n, total: n }),
    clearNpcs: () => ({ removed: 0, total: 0 }),
    npcCount: () => 0
  });
  window.__uiCheck = { inspector, lab };
  const tabs = [...document.querySelectorAll('[role="tab"]')].map(t => t.textContent);
  document.title = `UI ${tabs.join('|')} cards=${document.querySelectorAll('.si32__card').length}`;

</body>
</html>
